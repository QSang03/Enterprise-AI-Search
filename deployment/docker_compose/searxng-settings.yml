# SearXNG configuration for Onyx integration
# use_default_settings: true tells SearXNG to deep-merge with the built-in
# defaults — only the specific keys listed below override the base.
use_default_settings: true

server:
  port: 8080
  bind_address: "0.0.0.0"
  secret_key: "onyx-internal-searxng-key"
  limiter: false
  image_proxy: false
  method: POST

search:
  formats:
    - html
    - json
